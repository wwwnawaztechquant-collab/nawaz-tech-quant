<!DOCTYPE html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nawaz Tech Quant — Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#030a1a;--p:#06142e;--g:#3da5ff;--d:#15407a;--r:#ff5d7a;--y:#ffd24d;--t:#dcecff;--up:#4cc3ff;--m:#7fa9d9;--card:#0a2250}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font-family:'Noto Naskh Arabic','Noto Sans Devanagari','Share Tech Mono',sans-serif;font-size:14px;display:flex;flex-direction:column;overflow:hidden;
background-image:linear-gradient(#15407a33 1px,transparent 1px),linear-gradient(90deg,#15407a33 1px,transparent 1px);background-size:32px 32px}
.edu{background:#0b2a66;color:var(--y);text-align:center;font-size:12px;padding:2px;letter-spacing:1px}
header{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--d);background:var(--p);padding:6px 12px;direction:ltr}
h1{margin:0;font:700 18px 'Share Tech Mono',monospace;color:var(--g);letter-spacing:3px;text-shadow:0 0 12px var(--g);white-space:nowrap}
.sub{font:10px 'Share Tech Mono',monospace;color:var(--m)}
#price{font:700 20px 'Share Tech Mono',monospace;color:var(--up);min-width:110px;text-align:right}
header select{width:auto;max-width:170px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 310px;gap:8px;padding:8px;direction:ltr}
.side{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
body.rtl .side{direction:rtl}body:not(.rtl) .side{direction:ltr}
.box{border:1px solid var(--d);background:var(--p);border-radius:8px;padding:10px}
.box h2{margin:0 0 6px;font:12px 'Share Tech Mono',monospace;color:var(--g);letter-spacing:2px}
#cw{display:flex;flex-direction:column;min-height:0;padding:4px;position:relative}
.tb{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:2px 2px 6px;direction:ltr}
.tb button{width:auto;padding:4px 9px;font-size:12px;font-family:'Share Tech Mono',monospace}
.tb button.on{background:#1f6fe0;border-color:#6bb8ff;color:#fff}
.tb .sep{width:1px;height:20px;background:var(--d);margin:0 4px}
.tb .ib{background:#1f6fe0;border-color:#6bb8ff;color:#fff;font-weight:700}
body.ctp #wmk{filter:invert(1)}
body #cts{font-weight:700;border:1px solid #f5c242!important;color:#f5c242!important}
#chwrap{position:relative;flex:1;min-height:0}#chart{position:absolute;inset:0}
#msg{font-size:11px;color:var(--m);padding:3px 6px;direction:ltr}
.call{font:700 34px 'Share Tech Mono',monospace;direction:ltr;text-align:center;line-height:1.1}
.call.WAIT{color:var(--y)}.call.SELL{color:var(--r)}.call.BUY{color:var(--up);text-shadow:0 0 14px var(--up)}
.cl{font-size:15px;font-weight:700;text-align:center}
input,select,button,textarea{font:inherit;background:#041029;color:var(--t);border:1px solid var(--d);border-radius:5px;padding:5px;width:100%}
button{cursor:pointer;font-weight:700}button:hover{border-color:var(--g)}
label{display:block;font:11px 'Share Tech Mono',monospace;color:var(--m);margin:6px 0 2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.out{font-family:'Share Tech Mono',monospace;direction:ltr;text-align:left;color:var(--up);line-height:1.7}
.tiny{font-size:11px;color:var(--m);margin-top:4px;line-height:1.6}
.bot{display:flex;gap:8px;align-items:center;justify-content:center}.bot svg{width:80px;flex:none}
.eye{fill:var(--g);transition:.3s}.alert .eye{fill:var(--y);animation:bl .5s infinite alternate}
@keyframes bl{to{opacity:.2}}.ant{animation:pu 1.6s infinite}@keyframes pu{50%{opacity:.3}}
.ag{display:flex;align-items:center;gap:8px;padding:5px 8px;border-inline-start:4px solid var(--r);background:var(--card);margin-bottom:4px;border-radius:4px;user-select:none;font-size:13px}
.ag.s1{border-color:var(--y)}.ag.s2{border-color:var(--g)}.ag b{flex:1}
.ic{font:700 16px 'Share Tech Mono',monospace;width:22px;text-align:center}
.s0 .ic{color:var(--r)}.s1 .ic{color:var(--y)}.s2 .ic{color:var(--g)}
.meter{height:8px;background:#0d2a5a;border-radius:4px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--r),var(--y),var(--up));width:0;transition:.4s}
#news{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow:hidden;border:1px solid var(--d);border-radius:5px;background:#041029;padding:4px 8px}.nb{background:#ff5d7a;color:#fff;font:700 10px "Share Tech Mono",monospace;padding:1px 6px;border-radius:3px}.nw{flex:1;overflow:hidden;white-space:nowrap}#nt{display:inline-block;padding-left:100%;animation:sc 80s linear infinite;direction:ltr;font:12px "Share Tech Mono",monospace;color:#cfe6ff}#nt:hover{animation-play-state:paused}@keyframes sc{to{transform:translateX(-100%)}}
/* switch */
.swt{appearance:none;-webkit-appearance:none;width:34px!important;height:18px;border-radius:9px;background:#26324f;position:relative;flex:none;border:1px solid var(--d);cursor:pointer;transition:.2s;padding:0!important}
.swt::after{content:'';position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;background:var(--m);transition:.2s}
.swt:checked{background:#1f6fe0}.swt:checked::after{left:17px;background:#fff}
.ck{display:flex;gap:8px;align-items:center;margin:5px 0;font-size:13px;cursor:pointer}
/* legend */
#lg{position:absolute;left:46px;top:6px;z-index:5;pointer-events:none;font:12px 'Share Tech Mono',monospace;direction:ltr;max-width:70%}
#lg .sym{color:#fff;font-weight:700;margin-bottom:2px;text-shadow:0 0 4px #000}#lg .ohlc{color:var(--m)}
.lr{display:flex;align-items:center;gap:6px;pointer-events:auto;padding:1px 4px;border-radius:4px;background:#030a1acc;margin-top:2px;width:max-content;max-width:100%}
.lr .ln{white-space:nowrap}.lr .lv{white-space:nowrap}
.lr button{width:22px;height:20px;padding:0;font-size:12px;border:none;background:transparent;color:var(--m);opacity:.35}
.lr:hover button{opacity:1}.lr.off .ln,.lr.off .lv{opacity:.35;text-decoration:line-through}
#lmain{max-height:38vh;overflow-y:auto;pointer-events:auto}.lrs{position:absolute;left:0;pointer-events:none}
.pdiv{position:absolute;left:0;right:56px;border-top:1px solid #1d4a8f;pointer-events:none;z-index:3}
/* modals */
.md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;align-items:center;justify-content:center}.md.show{display:flex}
.mb{background:var(--p);border:1px solid var(--g);border-radius:10px;padding:0;display:flex;flex-direction:column;max-height:86vh}
#ind .mb{width:min(860px,96vw);height:min(600px,86vh)}#set .mb{width:min(440px,94vw);padding:14px;overflow:auto}
.mh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--d)}.mh h3{margin:0;font:700 15px 'Share Tech Mono',monospace;color:var(--g);flex:none}
.mh input{flex:1}.mh .x{width:34px;flex:none}
.mbody{flex:1;display:flex;min-height:0}
.cats{width:210px;flex:none;border-inline-end:1px solid var(--d);overflow-y:auto;padding:6px}
.cat{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.cat:hover{background:var(--card)}.cat.on{background:#1f6fe0;color:#fff}.cat small{opacity:.7;font:11px 'Share Tech Mono',monospace}
.lst{flex:1;overflow-y:auto;padding:6px 10px}
.it{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid #0d2a5a;cursor:pointer;border-radius:5px}.it:hover{background:var(--card)}
.it b{font:700 13px 'Share Tech Mono',monospace;color:#fff;min-width:170px}.it span{flex:1;font-size:12px;color:var(--m)}
.it .tag{flex:none;font:10px 'Share Tech Mono',monospace;border:1px solid var(--d);border-radius:4px;padding:1px 6px;color:var(--g)}
.it.soon{opacity:.55;cursor:default}.it .add{width:28px;flex:none;padding:2px}
.empty{padding:18px;text-align:center;color:var(--m);line-height:1.9;border:1px dashed var(--d);border-radius:8px;margin:8px 0}
.tabs{display:flex;gap:4px;margin-bottom:10px}.tabs button{padding:6px}.tabs button.on{background:#1f6fe0;color:#fff}
.sr{display:flex;align-items:center;gap:8px;margin:6px 0}.sr label{flex:1;margin:0;font-size:12px}.sr input,.sr select{width:130px}.sr input[type=color]{height:30px;padding:2px;width:60px}.sr input[type=checkbox]{width:34px}
#dc{position:absolute;inset:0;pointer-events:none;z-index:2}
#dtools{position:absolute;left:4px;top:6px;z-index:6;display:flex;flex-direction:column;gap:3px;background:#030a1acc;border:1px solid var(--d);border-radius:6px;padding:3px}
#dtools button{width:32px;height:30px;padding:0;font-size:14px;border:1px solid transparent;background:transparent;font-family:'Share Tech Mono',monospace}
#dtools button.on{background:#1f6fe0;border-color:#6bb8ff;color:#fff}#dtools hr{width:80%;border:0;border-top:1px solid var(--d);margin:2px auto}
#dsty{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:7;display:none;gap:6px;align-items:center;background:var(--p);border:1px solid var(--g);border-radius:8px;padding:4px 8px}
#dsty input,#dsty select,#dsty button{width:auto;padding:2px 6px}#dsty input[type=color]{width:38px;height:26px;padding:1px}
#cd{position:absolute;right:0;width:62px;text-align:center;font:700 11px 'Share Tech Mono',monospace;color:#fff;padding:2px 0;z-index:4;pointer-events:none;display:none;border-radius:2px}
#txin{position:absolute;z-index:8;display:none;width:180px}
#chips{display:flex;flex-wrap:wrap;gap:4px;padding:0 2px 6px;direction:ltr;max-height:64px;overflow-y:auto}
.chip{display:flex;align-items:center;gap:4px;border:1px solid var(--d);background:#041029;border-radius:14px;padding:1px 3px 1px 9px;font:11px 'Share Tech Mono',monospace}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}.chip.off>span,.chip.off>i{opacity:.35;text-decoration:line-through}
.chip button{width:24px;height:22px;padding:0;border:none;background:transparent;font-size:13px}.chip button:hover{background:#15407a;border-radius:50%}
.cv{display:inline-flex;gap:5px}.lrs{z-index:6}.lr button{opacity:.8!important}
.drrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #0d2a5a}.drrow i{width:14px;height:14px;border-radius:3px;display:inline-block}.drrow span{flex:1}.drrow button{width:36px;padding:2px}
#lvd{font:700 12px 'Share Tech Mono',monospace;color:var(--m);white-space:nowrap}#lvdot{font-size:14px}
@media(max-width:900px){body{overflow:auto;height:auto}main{grid-template-columns:1fr}#cw{height:78vh;order:-1}.side{overflow:visible}.cats{width:120px}.it b{min-width:110px}}

/* ===== GLASS THEME ===== */
.orbs{display:none;position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;box-shadow:inset -30px -40px 80px rgba(0,0,60,.22),0 40px 80px rgba(20,60,160,.22)}
.o1{left:22%;top:-12%;width:34vw;height:34vw;background:radial-gradient(circle at 30% 28%,#fff 0,#2f7bffaa 18%,#2f7bff 55%,#2f7bffdd 100%)}
.o2{left:48%;top:58%;width:24vw;height:24vw;background:radial-gradient(circle at 30% 28%,#fff 0,#7fd6ffaa 18%,#7fd6ff 55%,#7fd6ffdd 100%)}
.o3{right:20%;top:30%;width:15vw;height:15vw;background:radial-gradient(circle at 30% 28%,#fff 0,#ffc94daa 18%,#ffc94d 55%,#ffc94ddd 100%)}
.o4{right:-6%;bottom:-14%;width:30vw;height:30vw;background:radial-gradient(circle at 30% 28%,#fff 0,#2f7bffaa 18%,#2f7bff 55%,#2f7bffdd 100%)}
.o5{left:-8%;bottom:8%;width:24vw;height:24vw;background:none;border:3vw solid #7fd6ff;box-shadow:inset 0 0 40px rgba(255,255,255,.6),0 30px 60px rgba(20,60,160,.2)}
body.glass .orbs{display:block}
header,main,.edu{position:relative;z-index:1}
body.glass{--bg:#cfe6ff;--p:rgba(255,255,255,.4);--g:#2f6fe0;--d:rgba(255,255,255,.9);--r:#ef476f;--y:#d98200;--t:#0b2a66;--up:#10b981;--m:#4a6fa8;--card:rgba(255,255,255,.55);background:linear-gradient(135deg,#e6f3ff 0%,#a9d4ff 45%,#6fa8ff 100%) fixed}
body.glass .box,body.glass header,body.glass .mb,body.glass #dtools,body.glass #dsty{background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.2));border:1.5px solid rgba(255,255,255,.85);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 24px 60px rgba(30,80,200,.25),inset 0 2px 0 rgba(255,255,255,.95),inset 0 -3px 10px rgba(255,255,255,.3)}
body.glass .box{border-radius:26px}
body.glass header{margin:8px 8px 0;border-radius:22px}
body.glass .edu{background:rgba(255,255,255,.55);color:#0b2a66}
body.glass h1{color:#0b2a66;text-shadow:none}body.glass .sub{color:var(--m)}
body.glass input,body.glass select,body.glass button,body.glass textarea{background:rgba(255,255,255,.58);color:var(--t);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(30,80,200,.1)}
body.glass .tb button.on,body.glass .ib,body.glass #dtools button.on,body.glass .tabs button.on,body.glass .cat.on{background:linear-gradient(135deg,#5aa2ff,#2f6fe0);color:#fff;border-color:#8dbaff}
body.glass #dtools button,body.glass .lr button,body.glass .chip button{background:transparent;border-color:transparent;box-shadow:none;color:var(--t)}
body.glass #news,body.glass .chip,body.glass .lr{background:rgba(255,255,255,.58);border-color:#fff;color:var(--t)}
body.glass #nt{color:#0b2a66}body.glass #lg .sym{color:var(--t);text-shadow:none}body.glass .ohlc{color:var(--m)}
body.glass #price{color:#0b2a66}body.glass .out{color:#1d5fd0}
body.glass .call.WAIT{color:#d98200}body.glass .call.BUY{text-shadow:0 6px 24px rgba(16,185,129,.45)}
body.glass .md{background:rgba(20,60,140,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body.glass .swt{background:rgba(110,140,190,.4)}body.glass .swt:checked{background:#2f6fe0}
body.glass #chwrap{border-radius:18px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 2px 12px rgba(255,255,255,.6)}
body.glass .meter{background:rgba(255,255,255,.65)}body.glass .eye{fill:#2f6fe0}
body.glass .ag,body.glass .it:hover,body.glass .drrow{background:rgba(255,255,255,.5)}
body.glass .it b,body.glass .cat{color:var(--t)}body.glass .cat.on{color:#fff}
body.glass .pdiv{border-top-color:rgba(255,255,255,.9)}
body.glass #cd{box-shadow:0 2px 8px rgba(0,0,0,.2)}
body.glass .tiny,body.glass label{color:var(--m)}
body.glass .btk{background:rgba(255,255,255,.55);border-color:#fff}
.btg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.btk{border:1px solid var(--d);border-radius:12px;padding:8px 10px;background:var(--card)}.btk b{font:700 20px 'DejaVu Sans Mono','Share Tech Mono',monospace}
.bttb{width:100%;border-collapse:collapse;font:12px 'DejaVu Sans Mono','Share Tech Mono',monospace}.bttb td,.bttb th{padding:4px 8px;border-bottom:1px solid rgba(120,150,200,.3);text-align:left;white-space:nowrap}
.sh{margin:12px 0 4px;padding:4px 8px;border-radius:8px;background:rgba(245,194,66,.15);color:var(--g);font:700 12px "Share Tech Mono",monospace;direction:ltr}

/* ===== permanent brand watermark (cannot be switched off) ===== */
#wmk{position:absolute;inset:0;z-index:3;pointer-events:none;user-select:none;overflow:hidden;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='200'><text x='180' y='100' text-anchor='middle' font-family='monospace' font-weight='700' font-size='15' letter-spacing='4' fill='%23ffffff' fill-opacity='.07' transform='rotate(-24 180 100)'>NAWAZTECH QUANT</text></svg>")}
#wmk .wmt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:100%}
#wmk .wmt b{display:block;font:700 clamp(24px,5.4vw,76px)/1 'Share Tech Mono',monospace;letter-spacing:.2em;padding-left:.2em;white-space:nowrap;background:linear-gradient(180deg,#fff3c4 0%,#f5c242 48%,#b98a1a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.2;filter:drop-shadow(0 2px 10px rgba(245,194,66,.35))}
#wmk .wmt i{display:block;margin-top:10px;font:600 clamp(9px,1.2vw,14px) 'Share Tech Mono',monospace;letter-spacing:.32em;color:#f5c242;opacity:.22;font-style:normal;white-space:nowrap}
#wmk .wmc{position:absolute;right:76px;bottom:30px;font:700 11px 'Share Tech Mono',monospace;letter-spacing:.2em;color:#f5c242;opacity:.4;text-shadow:0 1px 4px rgba(0,0,0,.6)}
body.glass #wmk .wmt b{background:linear-gradient(180deg,#5aa2ff,#1d4fb8);-webkit-background-clip:text;background-clip:text;opacity:.2;filter:none}body.glass #wmk .wmt i,body.glass #wmk .wmc{color:#1d4fb8}
#nvb{width:auto!important;padding:2px 8px!important;font-size:13px;flex:none}
.btsel{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.btsel label{display:flex;align-items:center;gap:5px;border:1px solid rgba(120,150,200,.4);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;margin:0;direction:ltr}.btsel input{width:auto;margin:0}.btsel label.on{background:rgba(245,194,66,.18);border-color:#f5c242}
.up{color:#10b981}.dn{color:#ef476f}

/* ===== DARK GLASS (Midnight Gold) ===== */
body.dg{--bg:#060914;--p:rgba(255,255,255,.06);--d:rgba(255,255,255,.14);--g:#f5c242;--y:#f5c242;--t:#eef2fb;--m:#a3aec6;--up:#2de2a3;--r:#ff5d7a;--card:rgba(255,255,255,.07);background:radial-gradient(1200px 700px at 12% -10%,#3b2c08 0%,transparent 60%),radial-gradient(900px 700px at 100% 110%,#0b3b33 0%,transparent 60%),linear-gradient(160deg,#07101f,#05070f 60%,#0a1020) fixed!important}
body.dg .orbs{display:block}
body.dg .orbs i{box-shadow:none;border:0;filter:blur(70px);opacity:.5}
body.dg .o1{background:#b98a1a;left:-6%;top:-14%}body.dg .o2{background:#10806a;left:50%;top:62%}body.dg .o3{background:#2a4fb0;opacity:.35}body.dg .o4{background:#0f8a70;right:-8%;bottom:-16%}body.dg .o5{display:none}
body.dg .box,body.dg header,body.dg .mb,body.dg #dtools,body.dg #dsty{background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22)}
body.dg .box{border-radius:24px}body.dg header{margin:8px 8px 0;border-radius:20px}
body.dg .edu{background:rgba(245,194,66,.12);color:#f5c242}
body.dg h1{color:#f5c242;text-shadow:0 0 14px rgba(245,194,66,.45)}body.dg .sub{color:var(--m)}
body.dg input,body.dg select,body.dg button,body.dg textarea{background:rgba(255,255,255,.08);color:var(--t);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
body.dg select option{background:#10172a;color:#eef2fb}
body.dg .tb button.on,body.dg .ib,body.dg #dtools button.on,body.dg .tabs button.on,body.dg .cat.on{background:linear-gradient(135deg,#f5c242,#c9931a);color:#171000;border-color:#ffe08a}
body.dg #dtools button,body.dg .lr button,body.dg .chip button{background:transparent;border-color:transparent;box-shadow:none;color:var(--t)}
body.dg #news,body.dg .chip,body.dg .lr{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:var(--t)}
body.dg #chwrap{border-radius:16px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.1)}
body.dg .ag,body.dg .it:hover,body.dg .drrow,body.dg .btk{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
body.dg .meter{background:rgba(255,255,255,.1)}body.dg .swt{background:rgba(255,255,255,.2)}body.dg .swt:checked{background:#d9a21e}
body.dg .md{background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

/* ===== Midnight Noir skin (charcoal + silver/teal, no gold) ===== */

const SRCF={close:c=>c.close,open:c=>c.open,high:c=>c.high,low:c=>c.low,hl2:c=>(c.high+c.low)/2,hlc3:c=>(c.high+c.low+c.close)/3,ohlc4:c=>(c.open+c.high+c.low+c.close)/4};
const srcA=(d,s)=>d.map(SRCF[s||'close']);
const nanA=n=>new Array(n).fill(NAN);
function sma(a,n){n=Math.max(1,n|0);const o=nanA(a.length);for(let i=n-1;i<a.length;i++){let s=0,ok=1;for(let j=i-n+1;j<=i;j++){const v=a[j];if(v!==v){ok=0;break}s+=v}if(ok)o[i]=s/n}return o}
function stdev(a,n){n=Math.max(1,n|0);const o=nanA(a.length);for(let i=n-1;i<a.length;i++){let s=0,q=0,ok=1;for(let j=i-n+1;j<=i;j++){const v=a[j];if(v!==v){ok=0;break}s+=v;q+=v*v}if(ok)o[i]=Math.sqrt(Math.max(0,q/n-(s/n)*(s/n)))}return o}
function ema(a,n,k){n=Math.max(1,n|0);k=k||2/(n+1);const o=nanA(a.length);let p=NAN,c=0,s=0;for(let i=0;i<a.length;i++){const v=a[i];if(v!==v)continue;if(p!==p){s+=v;c++;if(c===n){p=s/n;o[i]=p}}else{p=v*k+p*(1-k);o[i]=p}}return o}
function rma(a,n){return ema(a,n,1/Math.max(1,n))}
function wma(a,n){n=Math.max(1,n|0);const o=nanA(a.length),den=n*(n+1)/2;for(let i=n-1;i<a.length;i++){let s=0,ok=1;for(let j=0;j<n;j++){const v=a[i-n+1+j];if(v!==v){ok=0;break}s+=v*(j+1)}if(ok)o[i]=s/den}return o}
const MAF={SMA:sma,EMA:ema,SMMA:rma,WMA:wma};
function trA(d){return d.map((c,i)=>i?Math.max(c.high-c.low,Math.abs(c.high-d[i-1].close),Math.abs(c.low-d[i-1].close)):c.high-c.low)}
function atrA(d,n){return rma(trA(d),n)}
function hh(d,n,f){const o=nanA(d.length);for(let i=n-1;i<d.length;i++){let m=-Infinity;for(let j=i-n+1;j<=i;j++)m=Math.max(m,d[j][f]);o[i]=m}return o}
function ll(d,n,f){const o=nanA(d.length);for(let i=n-1;i<d.length;i++){let m=Infinity;for(let j=i-n+1;j<=i;j++)m=Math.min(m,d[j][f]);o[i]=m}return o}

function delta(c){if(c.tb!=null&&c.v)return 2*c.tb-c.v;const r=c.high-c.low||1;return (c.v||1)*((2*c.close-c.high-c.low)/r)}

function smcCalc(D,L0,HS0,W0){

 for(let i=2*L;i<n;i++){
  const j=i-L;let isH=true,isL=true;
  for(let k=j-L;k<=j+L;k++){if(k===j)continue;
   if(k<j){if(D[k].high>=D[j].high)isH=false;if(D[k].low<=D[j].low)isL=false}
   else{if(D[k].high>D[j].high)isH=false;if(D[k].low<D[j].low)isL=false}}
  const buf=at[i]*(W/10);
  if(isH){ph.unshift(D[j].high);R.piv.push({i:j,p:D[j].high,t:'H',lab:ph.length>1&&ph[0]<ph[1]?'LH':'HH'});add(R.sup,{i0:j,top:D[j].high,bot:D[j].high-buf},at[i])}
  else if(isL){pl.unshift(D[j].low);R.piv.push({i:j,p:D[j].low,t:'L',lab:pl.length>1&&pl[0]<pl[1]?'LL':'HL'});add(R.dem,{i0:j,bot:D[j].low,top:D[j].low+buf},at[i])}
  const c=D[i].close;
  R.sup.forEach(z=>{if(!z.dead&&c>=z.top){R.bs.push({i0:z.i0,i1:i,y:(z.top+z.bot)/2});z.dead=true}});
  R.dem.forEach(z=>{if(!z.dead&&c<=z.bot){R.bd.push({i0:z.i0,i1:i,y:(z.top+z.bot)/2});z.dead=true}});
 }
 R.allBs=R.bs;R.allBd=R.bd;R.bs=R.bs.slice(-5);R.bd=R.bd.slice(-5);R.sup=live(R.sup);R.dem=live(R.dem);

   sig={d,en,sl,tp,time:c.time,i};sigs.push(sig);break}}

  df.inputs.forEach(x=>{const v=cur.p[x.k];if(x.t==='h'){h+=`<div class="sh">${x.l}</div>`;return}h+=`<div class="sr"><label>${x.l}</label>`+(x.t==='b'?`<input type="checkbox" class="swt" ${v?'checked':''} onchange="inp('${x.k}',this.checked)">`:x.t==='x'?`<input type="text" value="${v}" onchange="inp('${x.k}',this.value)">`:x.t==='s'?`<select onchange="inp('${x.k}',this.value)">${x.o.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`:`<input type="number" value="${v}" ${x.min!=null?`min="${x.min}"`:''} ${x.max!=null?`max="${x.max}"`:''} step="${x.step||1}" onchange="inp('${x.k}',+this.value)">`)+'</div>'});
  if(!df.inputs.length)h+=`<div class="tiny">—</div>`}
 else{df.sty.forEach((s,k)=>{h+=`<div class="sr"><label>${s.l}</label><input type="color" value="${cur.c[k]}" onchange="cur.c[${k}]=this.value;chg()">`+(s.w!=null?`<select onchange="cur.w[${k}]=+this.value;chg()">${[1,2,3,4].map(w=>`<option ${w===cur.w[k]?'selected':''}>${w}</option>`).join('')}</select>`:'<span style="width:130px"></span>')+'</div>'})}
 $('setb').innerHTML=h}

/* ================= news ================= */
let NSEEN=null,NSYM='',TRC=new Map(),VOX=[];
try{VOX=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{VOX=speechSynthesis.getVoices()}}catch(e){}
const hasVoice=b=>!VOX.length||VOX.some(v=>v.lang.toLowerCase().startsWith(b));
async function trNews(txt,tl){if(tl==='en')return txt;const k=tl+'|'+txt;if(TRC.has(k))return TRC.get(k);let out=null;
 try{const r=await (await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl='+tl+'&dt=t&q='+encodeURIComponent(txt))).json();out=r[0].map(x=>x[0]).join('')}catch(e){}
 if(!out){try{const r=await (await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(txt)+'&langpair=en|'+tl)).json();out=r.responseData.translatedText}catch(e){}}
 if(out)TRC.set(k,out);return out}
function speakOne(text,lang){return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.95;const v=VOX.find(x=>x.lang.toLowerCase()===lang.toLowerCase())||VOX.find(x=>x.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));if(v)u.voice=v;u.onend=u.onerror=()=>res();speechSynthesis.speak(u)}catch(e){res()}})}
async function speakNews(list){if(!list.length)return;let tl='en',lang='en-US',pre='News: ';
 if(S.lang==='ur'){if(hasVoice('ur')){tl='ur';lang='ur-PK';pre='خبر: '}else if(hasVoice('hi')){tl='hi';lang='hi-IN';pre='समाचार: '}}
 else if(S.lang==='hi'&&hasVoice('hi')){tl='hi';lang='hi-IN';pre='समाचार: '}
 for(const h of list){let tx=await trNews(h.t,tl);if(!tx){tx=h.t;lang='en-US';pre='News: '}await speakOne(pre+tx,lang)}}
function newsHandle(items,sym){const keys=items.map(x=>x.t.toLowerCase().slice(0,80));
 if(NSEEN===null||NSYM!==sym){NSEEN=new Set(keys);NSYM=sym;return}
 const fresh=items.filter((x,i)=>!NSEEN.has(keys[i]));keys.forEach(k=>NSEEN.add(k));
 if(S.nv&&fresh.length)speakNews(fresh.slice(0,2))}
function nvIcon(){const b=$('nvb');if(b)b.textContent=S.nv?'🗞🔊':'🗞🔇'}
function toggleNewsVoice(){S.nv=!S.nv;sv();nvIcon();try{speechSynthesis.cancel()}catch(e){}if(S.nv&&NEWSL.length)speakNews(NEWSL.slice(0,1))}
let NEWSL=[];
const NEWSQ={XAUUSDT:['gold price XAU',/gold|xau|bullion|fed|dollar|inflation|yield|treasury|powell|rate/i,'GOLD'],XAGUSDT:['silver price XAG',/silver|xag|gold|dollar|fed|yield|inflation/i,'SILVER'],BTCUSDT:['bitcoin BTC price',/bitcoin|btc|crypto|etf|ethereum|fed|binance|coinbase/i,'BTC'],CLUSDT:['WTI crude oil price',/oil|crude|wti|brent|opec|energy|inventor|barrel|petrol/i,'OIL WTI'],BZUSDT:['Brent crude oil price',/oil|crude|brent|wti|opec|energy|inventor|barrel/i,'OIL BRENT'],EURUSDT:['EUR/USD euro dollar',/eur|euro|ecb|dollar|fed|forex|lagarde|powell/i,'EUR/USD']};
const GFEEDS=['https://www.fxstreet.com/rss/news','https://www.investing.com/rss/news_1.rss','https://cointelegraph.com/rss'];
let newsTok=0;
async function getFeed(u){try{const r=await (await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(u))).json();return(r.items||[]).map(i=>({t:i.title,d:Date.parse((i.pubDate||'').replace(' ','T')+'Z')||0}))}catch(e){return[]}}
async function news(){const tok=++newsTok,key=S.sym.split(':')[1],q=NEWSQ[key]||['markets',/./,key];
 const nb=document.querySelector('#news .nb');if(nb)nb.textContent='NEWS · '+q[2];
 const [sp,...gen]=await Promise.all([getFeed('https://news.google.com/rss/search?q='+encodeURIComponent(q[0])+'&hl=en-US&gl=US&ceid=US:en'),...GFEEDS.map(getFeed)]);
 if(tok!==newsTok)return;
 const seen=new Set(),out=[];const push=x=>{const k=x.t.toLowerCase().slice(0,60);if(!seen.has(k)){seen.add(k);out.push(x)}};
 sp.sort((a,b)=>b.d-a.d).slice(0,14).forEach(push);
 gen.flat().filter(x=>q[1].test(x.t)).sort((a,b)=>b.d-a.d).forEach(push);
 if(out.length<5)gen.flat().sort((a,b)=>b.d-a.d).slice(0,6).forEach(push);
 out.sort((a,b)=>b.d-a.d);
 if(!out.length){$('nt').textContent=t('nonews');return}
 NEWSL=out.slice(0,24);$('nt').textContent=NEWSL.map(x=>x.t).join('     ◆     ');
 $('nt').style.animationDuration=Math.max(50,$('nt').textContent.length*.2)+'s';newsHandle(NEWSL,key)}
